# main 用于跟踪上游，本仓库的开发与发布都在 my-branch 上
# 文件名与上游的 ci.yml 不同，便于在 Actions 中单独禁用上游的工作流
name: LunaTV CI

on:
  push:
    branches: [my-branch]
  pull_request:
    branches: [my-branch]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本取自 package.json 的 packageManager 字段，这里不能再指定 version
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:strict

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_STORAGE_TYPE: localstorage
